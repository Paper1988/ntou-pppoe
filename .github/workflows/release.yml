name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: Build exe
        run: pyinstaller --noconsole --onefile ntou-pppoe.spec
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntou-pppoe-windows
          path: dist/ntou-pppoe.exe
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/ntou-pppoe*.exe
