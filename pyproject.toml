[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ntou-pppoe"
version = "0.1.0"
description = "A reliable Windows PPPoE connection manager for NTOU dormitory networks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Paper" }
]
dependencies = ["rich>=13.0"]

[project.scripts]
ntou-pppoe = "ntou_pppoe.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=9.0", "ruff", "pyinstaller"]

[tool.setuptools.packages.find]
where = ["src"]
